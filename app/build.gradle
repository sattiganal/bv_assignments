plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

def langchain4jVersion = '1.20.0'
dependencies {
    // Use JUnit test framework.
    testImplementation libs.junit
    // This dependency is used by the application.
    implementation libs.guava
    // LangChain4j Core & OpenAI module
    implementation "dev.langchain4j:langchain4j:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-google-ai-gemini:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-embeddings-all-minilm-l6-v2:1.20.0-beta30"
    implementation "dev.langchain4j:langchain4j-document-parser-apache-tika:1.20.0-beta30"  
    implementation "dev.langchain4j:langchain4j-chroma:1.20.0-beta30"
    implementation "org.testcontainers:chromadb:1.21.3"
    implementation "org.mapdb:mapdb:3.0.9"
    implementation "ch.qos.logback:logback-classic:1.5.18"
    implementation "org.apache.logging.log4j:log4j-core:2.25.1"
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.beyondvector.assignments.a2.PricingAgentWithRAG'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('run') {
    if (project.hasProperty('debugApp')) {
        jvmArgs = ['-agentlib:jdwp=transport=dt_socket,server=y,suspend=y,address=*:5005']
    }
}
